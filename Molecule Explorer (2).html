<style>
/* Layout: dot-matrix masthead, left rail of molecule pills, right stage with 2D/3D viewer and readouts. Nothing OS: black, white, one red. */
:root {
  --bg: #000000; --panel: #070707; --fg: #FFFFFF; --dim: #8C8C8C; --line: #2B2B2B; --dot: #1E1E1E; --red: #D71921;
  --display: 'Doto', 'Courier New', monospace; --body: 'Space Mono', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #EFEFED; --panel: #F7F7F5; --fg: #000000; --dim: #6B6B6B; --line: #CFCFCB; --dot: #DADAD6; color-scheme: light; }
}
:root[data-theme="light"] { --bg: #EFEFED; --panel: #F7F7F5; --fg: #000000; --dim: #6B6B6B; --line: #CFCFCB; --dot: #DADAD6; color-scheme: light; }

* { box-sizing: border-box; }
body {
  background-color: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5;
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 18px 18px;
  padding-block: 32px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.6rem, 9vw, 5rem); letter-spacing: .06em; line-height: 1; margin: 0; }
h1 span { color: var(--red); }
.sub { color: var(--dim); font-size: .72rem; letter-spacing: .26em; text-transform: uppercase; margin: 10px 0 28px; }
.lbl { color: var(--dim); font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; margin: 0 0 8px; }

.layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { border: 1px solid var(--line); border-radius: 28px; background: var(--panel); padding: 20px; }
.rail { display: flex; flex-direction: column; gap: 18px; }

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
button, input { font: inherit; color: inherit; }
.pill {
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  font-size: .76rem; letter-spacing: .04em; color: var(--fg);
}
.pill:hover { border-color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill.red { border-color: var(--red); color: var(--red); }
.pill.red:hover { background: var(--red); color: #fff; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.field {
  width: 100%; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: .82rem; color: var(--fg);
}
.field::placeholder { color: var(--dim); }
.field.bad { border-color: var(--red); }

.stage { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.name { font-family: var(--display); font-weight: 900; font-size: clamp(1.7rem, 5vw, 2.6rem); letter-spacing: .04em; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.formula { font-size: 1rem; margin-top: 4px; }
.smiles { color: var(--dim); font-size: .72rem; word-break: break-all; margin-top: 6px; }
.viewhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.tab-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pane2d { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; }
.pane2d svg { width: 100%; height: 100%; display: block; }
.pane3d { position: relative; width: 100%; height: 420px; border-radius: 22px; overflow: hidden; background: #000; border: 1px solid var(--line); }
.msg { color: var(--dim); text-align: center; padding: 20px; }
.msg.err { color: var(--red); }
.hint { color: var(--dim); font-size: .7rem; margin-top: 10px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px; background: var(--panel); min-width: 0; }
.stat b { display: block; font-family: var(--display); font-weight: 900; font-size: 2.2rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat.hot b { color: var(--red); }
.stat small { color: var(--dim); font-size: .7rem; }

.rule { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: .82rem; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--fg); flex: none; }
.dot.on { background: var(--fg); } .dot.off { background: var(--red); border-color: var(--red); }
.score { font-family: var(--display); font-weight: 900; font-size: 2.4rem; line-height: 1; margin-top: 14px; }
.score.off { color: var(--red); }
.note { color: var(--dim); font-size: .72rem; margin-top: 10px; }
.list { max-height: 330px; overflow-y: auto; padding-right: 4px; }
.paperwrap { background: #fff; border-radius: 18px; padding: 24px; overflow-x: auto; }
@media (prefers-reduced-motion: no-preference) { .pill, .field { transition: background .15s, border-color .15s, color .15s; } }

.nav{flex-wrap:nowrap;overflow-x:auto;margin:0 0 22px;padding-bottom:4px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav .pill{flex:none}
.pg.col{display:flex;flex-direction:column;gap:20px}
.dt{width:100%;border-collapse:collapse}.dt th,.dt td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:400;white-space:nowrap;font-size:.8rem}
.dt th{color:var(--dim);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}.dt tr.cl{cursor:pointer}.dt tr.cl:hover td{background:var(--dot)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;margin:12px 0}
select.field{appearance:none;-webkit-appearance:none;margin-bottom:12px;background:var(--panel)}select.field option{background:var(--panel);color:var(--fg)}
.fl{list-style:none;margin:0;padding:0}.fl li{padding:8px 0;border-bottom:1px solid var(--line)}.fl li::before{content:"\25CF ";color:var(--red);font-size:.6rem}
.card{border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:10px 0}.card b{display:block;margin-bottom:2px}
.qb{border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}.qb p{margin:0 0 8px;font-weight:700}
.qb label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}.qb input{accent-color:var(--red);margin-top:4px}.qb.ok{border-color:var(--fg)}.qb.no{border-color:var(--red)}
.chart{width:100%;height:auto;color:var(--fg);display:block}
.vmsg{font-size:.72rem;margin-top:8px;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>

  }

const ALL = {}; Object.values(LIB).forEach(g => Object.assign(ALL, g));
const CATS = Object.keys(LIB);

/* ---------- SMILES reader ---------- */
const EL = {
  H:[1.008,[1]], B:[10.81,[3]], C:[12.011,[4]], N:[14.007,[3,5]], O:[15.999,[2]], F:[18.998,[1]], Si:[28.085,[4]],
  P:[30.974,[3,5]], S:[32.06,[2,4,6]], Cl:[35.45,[1]], Br:[79.904,[1]], I:[126.904,[1]], Se:[78.971,[2,4,6]],
  Li:[6.94,[1]], Na:[22.99,[1]], K:[39.098,[1]], Mg:[24.305,[2]], Ca:[40.078,[2]], Fe:[55.845,[2,3]], Zn:[65.38,[2]], Cu:[63.546,[1,2]]

function parseSmiles(s) {
  const atoms = [], bonds = [], stack = [], rings = {};
  let prev = -1, pend = null, i = 0;
  const addBond = (a, b, ch) => {
    let order = 1, arom = false;
    if (ch === '=') order = 2; else if (ch === '#') order = 3; else if (ch === ':') arom = true;
    else if (ch === null && atoms[a].arom && atoms[b].arom) arom = true;
    bonds.push({ a, b, order, arom });
  };
  const addAtom = a => { const idx = atoms.length; atoms.push(a); if (prev >= 0) addBond(prev, idx, pend); pend = null; prev = idx; };
  while (i < s.length) {
    const c = s[i];
    if (c === '(') { if (prev < 0) throw 0; stack.push(prev); i++; continue; }
    if (c === ')') { if (!stack.length) throw 0; prev = stack.pop(); i++; continue; }
    if (c === '.') { prev = -1; pend = null; i++; continue; }
    if ('-=#:/\\'.includes(c)) { pend = (c === '/' || c === '\\') ? '-' : c; i++; continue; }
    if (/\d/.test(c) || c === '%') {
      let n; if (c === '%') { n = s.substr(i + 1, 2); i += 3; } else { n = c; i++; }
      if (prev < 0) throw 0;
      if (rings[n]) { addBond(rings[n].atom, prev, pend || rings[n].bond); delete rings[n]; }
      else rings[n] = { atom: prev, bond: pend };
      pend = null; continue;
    }
    if (c === '[') {
      const j = s.indexOf(']', i); if (j < 0) throw 0;
      const body = s.slice(i, j + 1);
      const m = /^\[(\d+)?([A-Za-z][a-z]?)(@@?)?(?:H(\d*))?([+-]+\d*)?(?::\d+)?\]$/.exec(body);
      if (!m) throw 0;
      const sym = m[2], arom = sym[0] === sym[0].toLowerCase();
      const el = sym[0].toUpperCase() + sym.slice(1);
      if (!EL[el]) throw 0;
      let h = 0;
      if (/H/.test(body.replace(/^\[\d*[A-Za-z][a-z]?/, ''))) h = m[4] ? +m[4] : 1;
      let ch = 0;
      if (m[5]) { const t = /^([+-])(\d+)$/.exec(m[5]); ch = t ? (t[1] === '+' ? +t[2] : -t[2]) : (m[5].split('+').length - 1) - (m[5].split('-').length - 1); }
      addAtom({ el, arom, h, ch, br: true }); i = j + 1; continue;
    }
    const two = s.substr(i, 2);
    if (two === 'Cl' || two === 'Br') { addAtom({ el: two, arom: false, h: 0, ch: 0 }); i += 2; continue; }
    if ('BCNOPSFI'.includes(c)) { addAtom({ el: c, arom: false, h: 0, ch: 0 }); i++; continue; }
    if ('bcnosp'.includes(c)) { addAtom({ el: c.toUpperCase(), arom: true, h: 0, ch: 0 }); i++; continue; }
    throw 0;
  }
  if (!atoms.length || stack.length || Object.keys(rings).length) throw 0;
  atoms.forEach(a => { a.adj = []; a.base = 0; });
  bonds.forEach((b, k) => {
    atoms[b.a].adj.push({ j: b.b, k, order: b.order }); atoms[b.b].adj.push({ j: b.a, k, order: b.order });
    atoms[b.a].base += b.order; atoms[b.b].base += b.order;
  });

  atoms.forEach(a => {
    if (a.br) return;
    const v = EL[a.el][1];
    if (a.arom) {
      a.h = (a.el === 'C' || a.el === 'N' || a.el === 'B' || a.el === 'P') ? Math.max(0, v[0] - a.base - 1) : Math.max(0, v[0] - a.base);

}
function findRings(g) {
  const n = g.atoms.length, rs = [], seen = new Set();
  g.bonds.forEach((b, k) => {
    const prev = new Array(n).fill(-2); prev[b.a] = -1; const q = [b.a];
    while (q.length) {
      const u = q.shift(); if (u === b.b) break;
      for (const e of g.atoms[u].adj) { if (e.k === k || prev[e.j] !== -2) continue; prev[e.j] = u; q.push(e.j); }

    if (prev[b.b] === -2) return;
    const cyc = []; for (let x = b.b; x !== -1; x = prev[x]) cyc.push(x);

}
function perceiveAromatic(g) {
  const A = g.atoms;
  A.forEach(a => { a.ar = a.arom; });

}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const csvText = v => csvCell(/^[=+\-@\t\r]/.test(String(v)) ? "'" + v : v);
const lipRules = p => [['Molar mass ≤ 500', p.mw <= 500, p.mw.toFixed(1) + ' g/mol'], ['LogP ≤ 5', p.logp <= 5, p.logp.toFixed(2)], ['H-bond donors ≤ 5', p.hbd <= 5, String(p.hbd)], ['H-bond acceptors ≤ 10', p.hba <= 10, String(p.hba)]];

const CSV_HEAD = ['name', 'category', 'smiles', 'formula', 'molar_mass_g_mol', 'logp_estimated', 'tpsa_A2_estimated', 'h_bond_donors', 'h_bond_acceptors', 'rotatable_bonds', 'rings', 'heavy_atoms', 'lipinski_rules_passed', 'veber_rules_passed'];
const csvLine = (name, cat, smiles, p) => [csvText(name), csvText(cat), csvText(smiles), plainF(p.formula), p.mw.toFixed(2), p.logp.toFixed(2), p.tpsa.toFixed(1), p.hbd, p.hba, p.rot, p.rings, p.heavy, lipRules(p).filter(r => r[1]).length, veberRules(p).filter(r => r[1]).length].join(',');

function lightSvg(smiles) {
  return new Promise(res => {
    if (typeof SmilesDrawer === 'undefined') return res('');
    const holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;left:-9999px;top:0;width:640px;height:480px;visibility:hidden';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); holder.appendChild(svg); document.body.appendChild(holder);
    const k = '#111111', theme = { C: k, O: '#D71921', N: k, F: k, CL: k, BR: k, I: k, P: k, S: k, B: k, SI: k, H: k, BACKGROUND: 'transparent' };
    const sd = new SmilesDrawer.SvgDrawer({ width: 640, height: 480, bondThickness: 1.7, padding: 24, themes: { paper: theme } });
    const done = out => { holder.remove(); res(out); };
    SmilesDrawer.parse(smiles, t => {
      try {
        sd.draw(t, svg, 'paper');
        if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', '0 0 640 480');
        if (!svg.getAttribute('xmlns')) svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        svg.removeAttribute('width'); svg.removeAttribute('height'); svg.style.width = ''; svg.style.height = '';
        done(svg.outerHTML);
      } catch (e) { done(''); }
    }, () => done(''));
  });
}

function buildReport(name, smiles, g, p, svg, cat) {

  const veVerdict = vp === 2 ? 'Meets both Veber criteria for oral bioavailability' : vp + ' of 2 Veber criteria met';
  const tbl = rows => '<table>' + rows.map(r => `<tr><th>${esc(r[0])}</th><td class="v">${esc(r[1])}${r[2] ? ' <span class="u">' + esc(r[2]) + '</span>' : ''}</td></tr>`).join('') + '</table>';
  const rules = rs => '<table>' + rs.map(r => `<tr><th><span class="dot ${r[1] ? 'on' : 'off'}"></span>${esc(r[0])}</th><td class="v">${esc(r[2])}</td></tr>`).join('') + '</table>';
  const disclaimer = 'LogP and TPSA are estimates from atom and fragment contributions, usually within about 0.5 of RDKit. Rotatable bonds and hydrogen-bond counts are simple structural counts. This is a rough screening report, not medical or pharmaceutical advice.';
  const body = `<h1>${esc(name.toUpperCase())}<i>.</i></h1><div class="meta">Molecule report · ${date}</div>` +
    `<div class="struct">${svg || '<p class="note">Structure drawing unavailable.</p>'}</div>` +
    `<h2>Identity</h2><table><tr><th>Formula</th><td class="v">${p.formula}</td></tr><tr><th>SMILES</th><td class="smi">${esc(smiles)}</td></tr></table>` +
    `<h2>Properties</h2>${tbl(propRows(p))}` +
    `<h2>Drug-likeness · Lipinski</h2>${rules(lip)}<p class="verdict">${esc(verdict)}</p>` +
    `<h2>Drug-likeness · Veber</h2>${rules(ve)}<p class="verdict">${esc(veVerdict)}</p>` +
    `<p class="note">${esc(disclaimer)}</p>`;
  const doc = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(name) + ' · Molecule report</title>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Space+Mono:wght@400&display=swap">' +
    '<style>body{margin:0;padding:32px 16px;background:#fff}' + REPORT_CSS + '</style></head><body><div class="rp">' + body + '</div></body></html>';
  const md = ['# ' + name, '', '_Molecule report · ' + date + '_', '', '**Formula:** ' + f + '  ', '**SMILES:** `' + smiles + '`', '',
    '## Properties', '', '| Property | Value |', '|---|---|', ...propRows(p).map(r => '| ' + r[0] + ' | ' + r[1] + (r[2] ? ' ' + r[2] : '') + ' |'), '',
    '## Lipinski rule of five', '', ...lip.map(r => '- [' + (r[1] ? 'x' : ' ') + '] ' + r[0] + ' (' + r[2] + ')'), '', '**' + verdict + '**', '',
    '## Veber rules', '', ...ve.map(r => '- [' + (r[1] ? 'x' : ' ') + '] ' + r[0] + ' (' + r[2] + ')'), '', '**' + veVerdict + '**', '', '> ' + disclaimer, ''].join('\n');
  const json = JSON.stringify({
    name, smiles, formula: f, date,
    properties: { molar_mass_g_per_mol: +p.mw.toFixed(2), logp_estimated: +p.logp.toFixed(2), tpsa_A2_estimated: +p.tpsa.toFixed(1), h_bond_donors: p.hbd, h_bond_acceptors: p.hba, rotatable_bonds: p.rot, rings: p.rings, heavy_atoms: p.heavy },
    lipinski: { rules_passed: lp, rules: lip.map(r => ({ rule: r[0], pass: r[1], value: r[2] })) },
    veber: { rules_passed: vp, rules: ve.map(r => ({ rule: r[0], pass: r[1], value: r[2] })) }

    if (k === 'mol') { const r = cache3d[smiles] || (cache3d[smiles] = embed3D(g)); return { filename: slug + '-3d.mol.txt', data: r.molblock }; }
    if (k === 'all') {

      return { filename: 'molecule-library.csv', data: CSV_HEAD.join(',') + '\n' + rows.join('\n') + '\n' };

}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();

}
async function saveFile(f) {
  if (!DL && window.claude && window.claude.use) { try { DL = (await window.claude.use('downloads')) || null; } catch (e) {} }
  if (DL) {
    try { await DL.save(f); return 'Saved ' + f.filename + '.'; }
    catch (e) { if (e && e.code === 'declined') return 'Download cancelled.'; }
  }
  try {
    const n = f.filename.toLowerCase();
    const type = /\.html$/.test(n) ? 'text/html' : /\.csv$/.test(n) ? 'text/csv' : /\.json$/.test(n) ? 'application/json' : /\.svg$/.test(n) ? 'image/svg+xml' : 'text/plain';
    const url = URL.createObjectURL(new Blob([f.data], { type: type + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = f.filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    const copied = await copyText(f.data);
    return 'Downloaded ' + f.filename + '.' + (copied ? ' If your browser blocked it, the text is on your clipboard.' : '');
  } catch (e) {
    return (await copyText(f.data)) ? 'Download unavailable here. Copied ' + f.filename + ' to your clipboard.' : 'Could not download or copy. Select the report and copy it by hand.';
  }
}

  $('cClr').onclick = () => { cmp.length = 0; renderCompare(); };
  $('cCsv').onclick = () => saveOut({ filename: 'comparison-table.csv', data: CSV_HEAD.join(',') + '\n' + cmp.map(c => csvLine(c.name, catOf(c.name), c.smiles, c.p)).join('\n') + '\n' }, $('cMsg'));
  document.querySelectorAll('#pg-compare [data-rm]').forEach(b => { b.onclick = () => { cmp.splice(+b.dataset.rm, 1); renderCompare(); }; });
}

/* ---- structure-property analysis ---- */
const AX = { mw: ['Molar mass', p => p.mw], logp: ['LogP', p => p.logp], tpsa: ['TPSA', p => p.tpsa], hbd: ['H-bond donors', p => p.hbd], hba: ['H-bond acceptors', p => p.hba], rot: ['Rotatable bonds', p => p.rot], rings: ['Rings', p => p.rings], heavy: ['Heavy atoms', p => p.heavy] };
let ax = 'mw', ay = 'logp';
function pearson(x, y) { const n = x.length, mx = x.reduce((a, b) => a + b, 0) / n, my = y.reduce((a, b) => a + b, 0) / n; let a = 0, b = 0, c = 0; x.forEach((v, i) => { a += (v - mx) * (y[i] - my); b += (v - mx) * (v - mx); c += (y[i] - my) * (y[i] - my); }); return b > 0 && c > 0 ? a / Math.sqrt(b * c) : NaN; }
function renderAnalysis() {
  const opts = k => Object.keys(AX).map(id => '<option value="' + id + '"' + (k === id ? ' selected' : '') + '>' + AX[id][0] + '</option>').join('');
  let body = '';
  if (cmp.length < 2) body = '<div class="card">Add at least two molecules in the Compare page first.</div>';
  else {
    const xs = cmp.map(c => AX[ax][1](c.p)), ys = cmp.map(c => AX[ay][1](c.p));
    const W = 360, H = 280, pd = 40, lo = a => Math.min.apply(null, a), hi = a => Math.max.apply(null, a);
    const sx = lo(xs) === hi(xs) ? 1 : hi(xs) - lo(xs), sy = lo(ys) === hi(ys) ? 1 : hi(ys) - lo(ys);
    const px = v => pd + (v - lo(xs)) / sx * (W - 2 * pd), py = v => H - pd - (v - lo(ys)) / sy * (H - 2 * pd);
    const tx = 'font-family:var(--body);font-size:10px;fill:var(--fg)';
    const pts = cmp.map((c, i) => '<circle cx="' + px(xs[i]) + '" cy="' + py(ys[i]) + '" r="6" style="fill:var(--red)"/><text x="' + (px(xs[i]) + 9) + '" y="' + (py(ys[i]) - 7) + '" style="' + tx + '">' + esc(c.name) + '</text>').join('');
    const r = pearson(xs, ys), ar = Math.abs(r), strength = ar > .7 ? 'strong' : ar > .4 ? 'moderate' : 'weak';
    const iH = ys.indexOf(hi(ys)), iL = ys.indexOf(lo(ys)), g0 = cmp.filter(c => c.p.hbd === 0), g1 = cmp.filter(c => c.p.hbd > 0), av = g => g.reduce((s, c) => s + c.p.logp, 0) / g.length;
    body = '<div class="tw" style="padding:8px"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Scatter plot"><line x1="' + pd + '" y1="' + (H - pd) + '" x2="' + (W - 10) + '" y2="' + (H - pd) + '" style="stroke:var(--fg)"/><line x1="' + pd + '" y1="10" x2="' + pd + '" y2="' + (H - pd) + '" style="stroke:var(--fg)"/>' + pts +
      '<text x="' + (W / 2) + '" y="' + (H - 8) + '" text-anchor="middle" style="' + tx + '">' + AX[ax][0] + ' (' + f1(lo(xs), 2) + ' to ' + f1(hi(xs), 2) + ')</text><text transform="rotate(-90 12 ' + (H / 2) + ')" x="12" y="' + (H / 2) + '" text-anchor="middle" style="' + tx + '">' + AX[ay][0] + ' (' + f1(lo(ys), 2) + ' to ' + f1(hi(ys), 2) + ')</text></svg></div>' +
      '<p class="lbl" style="margin-top:16px">Observations</p>' +
      card('Correlation', AX[ax][0] + ' vs ' + AX[ay][0] + ': r = ' + (isNaN(r) ? 'undefined (one value is constant)' : f1(r, 2) + ', ' + strength + (r > 0 ? ' positive' : ' negative')) + ' across ' + cmp.length + ' molecules.') +
      card('Extremes', 'Highest ' + AX[ay][0] + ': ' + esc(cmp[iH].name) + ' (' + f1(ys[iH], 2) + '). Lowest: ' + esc(cmp[iL].name) + ' (' + f1(ys[iL], 2) + ').') +
      (g0.length && g1.length ? card('Hydrogen-bond donors', 'Mean LogP without donors: ' + f1(av(g0), 2) + '. With donors: ' + f1(av(g1), 2) + '. Donors usually make a molecule friendlier to water.') : '');
  }
  $('pg-analysis').innerHTML = '<section class="panel"><p class="lbl">Structure–property analysis</p><div class="note" style="margin:0 0 12px">Uses the molecules in the comparison table.</div><p class="lbl">X axis</p><select class="field" id="aX">' + opts(ax) + '</select><p class="lbl">Y axis</p><select class="field" id="aY">' + opts(ay) + '</select>' + body + '</section>';
  $('aX').onchange = e => { ax = e.target.value; renderAnalysis(); };
  $('aY').onchange = e => { ay = e.target.value; renderAnalysis(); };
}

/* ---- assessment ---- */
const QZ = [
  ['What is the full form of SMILES?', ['Simplified Molecular Input Line Entry System','Standard Molecular Information Language Encoding System','Simple Molecular Identification and Labeling System']],
  ['What does a SMILES string represent?', ['A molecular structure using text','A spectroscopy technique','A laboratory instrument']],
  ['Which SMILES represents ethanol?', ['CCO','c1ccccc1','CC(=O)O']],
  ['Which SMILES represents benzene?', ['c1ccccc1','CCO','O=C=O']],
  ['In SMILES, parentheses are mainly used to indicate…', ['Branches','Ring closures','Charges']],
  ['How many pi bonds are in CO2 (O=C=O)?', ['2','1','4']],
  ['A positive LogP means the molecule is…', ['More lipophilic than hydrophilic','More water soluble','Electrically charged']],
  ['TPSA is related to…', ['Polar atoms and membrane permeability','Boiling point','Molecular colour']],
  ['Lipinski rule of five: maximum molar mass?', ['500 g/mol','180 g/mol','1000 g/mol']],
  ['How many sigma bonds does ethanol (C2H6O) have?', ['8','9','7']]
];
const ans = {};
function renderQuiz() {
  $('pg-quiz').innerHTML = '<section class="panel"><p class="lbl">Assessment</p><h2 class="name">CHEMINFORMATICS ASSESSMENT</h2>' +
    QZ.map((q, i) => '<div class="qb" id="qb' + i + '"><p>' + (i + 1) + '. ' + esc(q[0]) + '</p>' + [0, 1, 2].map(k => (k + i) % 3).map(o => '<label><input type="radio" name="q' + i + '" value="' + o + '"> <span>' + esc(q[1][o]) + '</span></label>').join('') + '<div class="note" id="qn' + i + '"></div></div>').join('') +
    '<div class="row"><button class="pill red" type="button" id="qSub">SUBMIT ASSESSMENT</button><button class="pill" type="button" id="qRst">RESET</button></div><div id="qRes"></div></section>';
  document.querySelectorAll('#pg-quiz input[type=radio]').forEach(r => { r.onchange = () => { ans[+r.name.slice(1)] = +r.value; }; });
  $('qSub').onclick = () => {
    let sc = 0, blank = 0;
    QZ.forEach((q, i) => { const el = $('qb' + i); el.className = 'qb'; $('qn' + i).textContent = ''; if (ans[i] === undefined) { blank++; return; } const ok = ans[i] === 0; if (ok) sc++; el.className = 'qb ' + (ok ? 'ok' : 'no'); if (!ok) $('qn' + i).textContent = 'Correct answer: ' + q[1][0]; });
    $('qRes').innerHTML = '<div class="score ' + (sc >= 6 ? '' : 'off') + '">' + sc + '/' + QZ.length + '</div><div class="lbl" style="margin-top:6px">' + (blank ? blank + ' unanswered. ' : '') + (sc >= 8 ? 'Excellent work' : sc >= 5 ? 'Good, review the theory page' : 'Keep practising') + '</div>';
  };
  $('qRst').onclick = () => { Object.keys(ans).forEach(k => delete ans[k]); renderQuiz(); };
}
renderQuiz();

/* ---- final report ---- */
const fin = { name: '', reg: '', rep: null };
function snap3d() {
  try {
    if (typeof $3Dmol === 'undefined' || !curG) return '';
    let res = cache3d[cur.smiles]; if (!res) res = cache3d[cur.smiles] = embed3D(curG);
    const h = document.createElement('div'); h.style.cssText = 'position:fixed;left:-9999px;top:0;width:420px;height:420px'; document.body.appendChild(h);
    const cf = a => (a.elem === 'C' || a.elem === 'H' || a.elem === 'N') ? '#1E5BFF' : '#D71921';
    const v = $3Dmol.createViewer(h, { backgroundColor: '#0a0a0a' });
    v.addModel(res.molblock, 'sdf'); v.setStyle({}, { stick: { radius: 0.11, color: '#FFFFFF' }, sphere: { scale: 0.38, colorfunc: cf } });
    v.zoomTo(); v.render(); const u = v.pngURI(); try { v.clear(); } catch (e) {} h.remove();
    return typeof u === 'string' && u.indexOf('data:') === 0 ? u : '';
  } catch (e) { return ''; }
}
function renderFinal() {
  const ok = !!curG; let p = null, b = null; if (ok) { p = props(curG); b = bondInfo(curG); }
  $('pg-final').innerHTML = '<section class="panel"><p class="lbl">Final project report</p><div class="note" style="margin:0 0 12px">Uses the molecule selected in the Explorer.</div>' +
    '<p class="lbl">Student name for report</p><input class="field" id="fName" type="text" autocomplete="off" value="' + esc(fin.name) + '" style="margin-bottom:12px">' +
    '<p class="lbl">Registration number for report</p><input class="field" id="fReg" type="text" autocomplete="off" value="' + esc(fin.reg) + '" style="margin-bottom:12px">' +
    '<p class="lbl">Molecule</p><div style="word-break:break-all">' + (ok ? esc(cur.name) + ' · <span style="color:var(--dim)">' + esc(cur.smiles) + '</span>' : '<span style="color:var(--red)">Invalid SMILES. Fix it in the Explorer.</span>') + '</div>' +
    (ok ? '<div class="stats" style="margin-top:14px">' + stat('Formula', p.formula) + stat('Molar mass', p.mw.toFixed(2), 'g/mol', true) + stat('Sigma (σ) bonds', b.sigma) + stat('Pi (π) bonds', b.pi) + '</div>' : '') +
    '<div class="row"><button class="pill red" type="button" id="fGen"' + (ok ? '' : ' disabled') + '>GENERATE PERSONALIZED FINAL REPORT</button></div></section>' +
    '<section class="panel" id="fOut" hidden><div class="tab-row" id="fDl"></div><div class="hint" id="fMsg" role="status" style="min-height:1.4em;margin-bottom:12px"></div><div class="paperwrap"><div class="rp" id="fRp"></div></div></section>';
  $('fName').oninput = e => { fin.name = e.target.value; };
  $('fReg').oninput = e => { fin.reg = e.target.value; };
  $('fGen').onclick = genFinal;
  if (fin.rep) showFinal();
}
async function genFinal() {
  if (!curG) return;
  const msg = $('fMsg'), out = $('fOut'); out.hidden = false; msg.textContent = 'Building report…'; $('fRp').innerHTML = '';
  await new Promise(r => setTimeout(r, 30));
  const name = cur.name, smiles = cur.smiles, g = curG, p = props(g), b = bondInfo(g);
  const svg = await lightSvg(smiles), img = snap3d();
  const stu = fin.name.trim() || '—', reg = fin.reg.trim() || '—', date = new Date().toISOString().slice(0, 10);
  const lip = lipRules(p), ve = veberRules(p), lp = lip.filter(r => r[1]).length, vp = ve.filter(r => r[1]).length, f = plainF(p.formula);
  const tbl = rows => '<table>' + rows.map(r => '<tr><th>' + esc(r[0]) + '</th><td class="v">' + esc(r[1]) + (r[2] ? ' <span class="u">' + esc(r[2]) + '</span>' : '') + '</td></tr>').join('') + '</table>';
  const rules = rs => '<table>' + rs.map(r => '<tr><th><span class="dot ' + (r[1] ? 'on' : 'off') + '"></span>' + esc(r[0]) + '</th><td class="v">' + esc(r[2]) + '</td></tr>').join('') + '</table>';
  const interp = (lp === 4 ? 'The molecule satisfies all four Lipinski criteria and is predicted to be drug-like. ' : lp === 3 ? 'The molecule breaks one Lipinski criterion, which is still acceptable for many oral drugs. ' : 'The molecule breaks ' + (4 - lp) + ' Lipinski criteria, so oral drug-likeness is doubtful. ') +
    (p.logp > 0 ? 'A positive LogP shows a preference for lipid environments. ' : 'A LogP near or below zero shows good affinity for water. ') +
    'The TPSA of ' + p.tpsa.toFixed(1) + ' Å² ' + (p.tpsa <= 140 ? 'is within the range that favours crossing membranes.' : 'is high and may limit passing through membranes.');
  const body = '<h1>FINAL STUDENT MOLECULAR ANALYSIS REPORT<i>.</i></h1><div class="meta">Cheminformatics virtual laboratory · ' + date + '</div>' +
    '<h2>Student</h2>' + tbl([['Name', stu], ['Registration number', reg]]) +
    '<h2>Molecule</h2><table><tr><th>Name</th><td class="v">' + esc(name) + '</td></tr><tr><th>Formula</th><td class="v">' + p.formula + '</td></tr><tr><th>SMILES</th><td class="smi">' + esc(smiles) + '</td></tr></table>' +
    '<h2>2D structure</h2><div class="struct">' + (svg || '<p class="note">Structure drawing unavailable.</p>') + '</div>' +
    (img ? '<h2>3D model</h2><div class="struct" style="background:#0a0a0a"><img src="' + img + '" alt="3D model" style="display:block;margin:0 auto;max-width:100%;width:340px"></div>' : '') +
    '<h2>Atoms and bonds</h2>' + tbl([['Heavy atoms', p.heavy], ['Total atoms (with H)', b.total], ['Heavy-atom bonds', b.heavyBonds], ['Sigma (σ) bonds', b.sigma], ['Pi (π) bonds', b.pi], ['Total bonds (σ+π)', b.bonds], ['Rings', p.rings]]) +
    '<h2>Properties</h2>' + tbl(propRows(p)) +
    '<h2>Drug-likeness · Lipinski</h2>' + rules(lip) + '<p class="verdict">' + lp + ' of 4 rules met</p>' +
    '<h2>Drug-likeness · Veber</h2>' + rules(ve) + '<p class="verdict">' + vp + ' of 2 criteria met</p>' +
    '<h2>Interpretation</h2><p>' + esc(interp) + '</p><p class="note">LogP and TPSA are estimates from atom and fragment contributions, usually within about 0.5 of RDKit. Rough screening only, not medical or pharmaceutical advice.</p>';
  const doc = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(name) + ' · Final report</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Space+Mono:wght@400&display=swap"><style>body{margin:0;padding:32px 16px;background:#fff}' + REPORT_CSS + '</style></head><body><div class="rp">' + body + '</div></body></html>';
  const md = ['# Final Student Molecular Analysis Report', '', '_' + date + '_', '', '**Student:** ' + stu + '  ', '**Registration number:** ' + reg, '', '## Molecule', '', '- Name: ' + name, '- Formula: ' + f, '- SMILES: `' + smiles + '`', '',
    '## Atoms and bonds', '', '- Heavy atoms: ' + p.heavy, '- Total atoms: ' + b.total, '- Sigma bonds: ' + b.sigma, '- Pi bonds: ' + b.pi, '- Total bonds: ' + b.bonds, '',
    '## Properties', '', ...propRows(p).map(r => '- ' + r[0] + ': ' + r[1] + (r[2] ? ' ' + r[2] : '')), '', '## Lipinski (' + lp + '/4)', '', ...lip.map(r => '- [' + (r[1] ? 'x' : ' ') + '] ' + r[0] + ' (' + r[2] + ')'), '', '## Veber (' + vp + '/2)', '', ...ve.map(r => '- [' + (r[1] ? 'x' : ' ') + '] ' + r[0] + ' (' + r[2] + ')'), '', '## Interpretation', '', interp, ''].join('\n');
  const slug = slugOf(stu === '—' ? name : stu + '-' + name);
  fin.rep = { body, files: { html: { filename: slug + '-final-report.html', data: doc }, md: { filename: slug + '-final-report.md', data: md }, csv: { filename: slug + '.csv', data: CSV_HEAD.join(',') + '\n' + csvLine(name, catOf(name), smiles, p) + '\n' } } };
  showFinal();
}
function showFinal() {
  if (!fin.rep || !$('fRp')) return;
  $('fOut').hidden = false; $('fRp').innerHTML = fin.rep.body; $('fMsg').textContent = '';
  const row = $('fDl'); row.innerHTML = '';
  [['HTML REPORT', 'html', 1], ['MARKDOWN', 'md', 0], ['CSV', 'csv', 0]].forEach(([l, k, red]) => { const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'pill' + (red ? ' red' : ''); bt.textContent = dlLabel(l); bt.onclick = () => saveOut(fin.rep.files[k], $('fMsg')); row.appendChild(bt); });
}

/* ---- 3D extras ---- */
$('vdw').onclick = () => { vdwOn = !vdwOn; $('vdw').setAttribute('aria-pressed', vdwOn); if (tab === '3d') render3D(); };
goPage('home');
})();
</script>
